name = "poollab"
main = "src/index.ts"
compatibility_date = "2025-11-01"
compatibility_flags = ["nodejs_compat"]

# One Worker serves both the SPA and the API. `/api/*` reaches the Worker first;
# everything else falls through to the static assets with SPA routing.
[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[observability]
enabled = true
