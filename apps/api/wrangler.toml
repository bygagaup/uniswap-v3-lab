name = "poollab"
main = "src/index.ts"
compatibility_date = "2025-11-01"
compatibility_flags = ["nodejs_compat"]

# One Worker serves both the SPA and the API. `/api/*` reaches the Worker first;
# everything else falls through to the static assets with SPA routing.
[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[observability]
enabled = true

[vars]
ENVIRONMENT = "development"

# Rate limiting, enforced before the upstream fetch and only on cache misses.
# RL_CHEAP covers pool search and metadata; RL_HEAVY covers poolHourData and
# ticksByPool, which return up to 1000 rows and cost real gateway budget.
[[unsafe.bindings]]
name = "RL_CHEAP"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[[unsafe.bindings]]
name = "RL_HEAVY"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

[env.production.vars]
ENVIRONMENT = "production"
